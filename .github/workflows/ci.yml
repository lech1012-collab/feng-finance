name: Verify local finance application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check-release.mjs --tag "${{ github.ref_name }}" --require-tag
  verify:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run check:release
      - run: npm run test:hygiene
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: synthetic-browser-test-results
          path: test-results/
          retention-days: 7
