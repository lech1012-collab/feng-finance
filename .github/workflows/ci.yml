name: Verify local finance application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check-release.mjs --tag "${{ github.ref_name }}" --require-tag
  verify:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run check:release
      - run: npm run test:hygiene
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      - name: Install browser dependencies
        timeout-minutes: 15
        run: |
          # The Azure Ubuntu mirror can stall hosted runners for many minutes.
          # Use the canonical archive; APT signature verification stays enabled.
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          npx playwright install --with-deps chromium webkit
      - run: node --test scripts/feng-ui-audit.test.mjs scripts/feng-polish-audit-evidence.test.mjs
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: synthetic-browser-test-results
          path: test-results/
          retention-days: 7
